name: Build free update ZIP
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test extension/tests/*.test.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build the version matching the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: dist/*.zip
      - name: Attach ZIP to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256
      - name: Update instructions
        run: echo 'Free update ZIP created. Apply from the extension management screen. No store account is used.'
